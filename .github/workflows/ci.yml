name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Evidence checks use /usr/bin/node with an empty environment, not the runner's PATH Node.
          sudo apt-get install -y --no-install-recommends jq shellcheck nodejs

      - name: Verify fixed-path Node prerequisite
        run: |
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/timeout 10 /usr/bin/node --version

      - name: ShellCheck lint
        run: |
          shellcheck -x *.sh worker/*.sh tests/*.sh

      - name: Run test suite
        run: |
          bash tests/final-gate.sh

      - name: Validate unified Compose model
        run: |
          cp repos.example.json repos.json
          cp .env.workers.example .env.workers
          ./deploy.sh generate
          docker compose \
            -p hangar-fleet \
            -f docker-compose.yml \
            -f docker-compose.workers.yml \
            --env-file .env.workers \
            config --quiet

      - name: Build interactive Dockerfile
        run: |
          docker build -t hangar-hub:ci .

      - name: Build worker Dockerfile
        run: |
          docker build -t hangar-worker:ci worker/
